# Generated by scripts/build-site.mjs from data/receipts.json. Edit it there.
name: New receipt
description: Add one sourced claim to the list. No code needed.
title: "Receipt: "
labels: ["receipt"]
body:
  - type: markdown
    attributes:
      value: "One claim, one source. The bar is the source, not the outrage: read [the rules](https://github.com/opposablemeaning/vote/blob/main/CONTRIBUTING.md#the-rules) first."
  - type: input
    id: url
    attributes:
      label: "Source link"
      description: "The original outlet or record (court opinion, roll call, agency release, transcript), not a repost, aggregator or screenshot."
      placeholder: "https://"
    validations:
      required: true
  - type: textarea
    id: caption
    attributes:
      label: "What does it show?"
      description: "One claim in plain words, saying only what the source says (160 characters at most). Put exact quotes in quotation marks."
    validations:
      required: true
  - type: dropdown
    id: beat
    attributes:
      label: "Topic"
      description: "Nothing fits? Pick the last option and say what's missing in the notes."
      options:
        - "CORRUPTION (corruption)"
        - "A TAX ON YOU (tax)"
        - "CRUELTY (cruelty)"
        - "WAR (war)"
        - "GENOCIDE (genocide)"
        - "BETRAYING THE TROOPS (troops)"
        - "WOMEN DYING (women)"
        - "LOSING YOUR HEALTHCARE (healthcare)"
        - "PROTECTING PEDOPHILES (epstein)"
        - "A VOTE AGAINST YOU (you)"
        - "REVENGE (revenge)"
        - "PARDONED RIOTERS (rioters)"
        - "HIGHER BILLS (bills)"
        - "BILLIONAIRES FIRST (billionaires)"
        - "BETRAYING ALLIES (allies)"
        - "DICTATOR WORSHIP (dictators)"
        - "BLAMING UKRAINE (ukraine)"
        - "VOTER SUPPRESSION (suppression)"
        - "ELECTION DENIAL (denial)"
        - "THEOCRACY (theocracy)"
        - "ANTI-SCIENCE (science)"
        - "DEATH BY SPREADSHEET (aid)"
        - "SELLING THE PRESIDENCY (insider)"
        - "THE GRIFT (grift)"
        - "USING JESUS (faith)"
        - "Something else"
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: "What kind of evidence is it?"
      options:
        - "QUOTE: Their own words, from a recording, transcript or post"
        - "COURT RULING: A decision by a judge, jury or court"
        - "COURT ORDER: An interim court order (like the ICJ's provisional measures), not a final ruling"
        - "COURT FILING: An allegation in a court filing, such as an indictment"
        - "OFFICIAL: A government record: a vote tally, an order, an agency release"
        - "REPORTED: Reporting by a news outlet"
        - "DATA: Published statistics"
        - "ESTIMATE: A projection or model (CBO, KFF, researchers), labeled as one"
        - "PROPOSED: Proposed, not done"
        - "LAW: Enacted law"
    validations:
      required: true
  - type: input
    id: outlet
    attributes:
      label: "Who published it?"
      placeholder: "Reuters, Supreme Court opinion, House roll call 123"
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: "When was it published?"
      placeholder: "YYYY-MM-DD"
    validations:
      required: true
  - type: input
    id: also
    attributes:
      label: "Second source (optional)"
      description: "Especially if the first one is paywalled."
  - type: textarea
    id: note
    attributes:
      label: "Notes (optional)"
      description: "Caveats, context or the exact quote."
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send it
      options:
        - label: I opened the source, and it says what my caption says.
          required: true
