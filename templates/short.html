<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Anton"; src: url("assets/fonts/Anton-Regular.ttf"); }
      @font-face { font-family: "Inter"; src: url("assets/fonts/Inter.ttf"); font-weight: 100 900; }
      @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/JetBrainsMono.ttf"); font-weight: 100 800; }
      @font-face { font-family: "Special Elite"; src: url("assets/fonts/SpecialElite-Regular.ttf"); }

      :root { --ink: #0b0b0c; --paper: #f3efe6; --red: #e3122b; --white: #f5f5f4; --tag: #ffd400; --win: #22c55e; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif; color: var(--white); }
      #stage { position: absolute; inset: 0; }
      #grain { position: absolute; inset: -50%; width: 200%; height: 200%; opacity: 0.09; pointer-events: none; }
      #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.75) 100%); }
      #flash { position: absolute; inset: 0; background: var(--white); opacity: 0; pointer-events: none; }
      #redflash { position: absolute; inset: 0; background: var(--red); opacity: 0; mix-blend-mode: screen; pointer-events: none; }

      /* persistent top headline; safe area clear of the Shorts UI (top ~200px, bottom ~420px, right ~140px) */
      #kicker { position: absolute; left: 60px; right: 140px; top: 250px; font-family: "Anton"; font-size: 84px; line-height: 1.02; color: var(--white); opacity: 0; }
      #kicker b { color: var(--red); font-weight: 400; }
      .slambox { position: absolute; left: 50px; right: 50px; top: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
      .slamline { font-family: "Anton"; line-height: 1.0; opacity: 0; text-align: center; }
      .head { position: absolute; left: 60px; right: 140px; top: 560px; font-family: "Inter"; font-weight: 900; font-size: 62px; line-height: 1.08; color: var(--tag); opacity: 0; }
      .bigstat { position: absolute; left: 0; right: 0; top: 650px; text-align: center; font-family: "Anton"; font-size: 330px; line-height: 1; color: var(--red); opacity: 0; }
      .statlbl { position: absolute; left: 60px; right: 60px; top: 1000px; text-align: center; font-family: "Inter"; font-weight: 900; font-size: 52px; color: var(--white); opacity: 0; }

      .card { position: absolute; left: 60px; width: 920px; padding: 44px 50px 38px; background: var(--paper); color: var(--ink); box-shadow: 0 30px 60px rgba(0,0,0,0.55), 0 4px 0 rgba(0,0,0,0.2); opacity: 0; }
      .tag { position: absolute; top: -24px; left: -16px; background: var(--tag); color: var(--ink); font-family: "JetBrains Mono"; font-weight: 800; font-size: 28px; padding: 6px 14px; box-shadow: 0 6px 12px rgba(0,0,0,0.35); }
      .status { display: inline-block; font-family: "JetBrains Mono"; font-weight: 800; font-size: 28px; letter-spacing: 0.08em; padding: 4px 12px; border: 3px solid currentColor; margin-bottom: 16px; }
      .cap { font-family: "Inter"; font-weight: 800; font-size: 64px; line-height: 1.1; letter-spacing: -0.01em; }
      .src { font-family: "JetBrains Mono"; font-size: 30px; color: #57534e; margin-top: 20px; }
      .stampmark { position: absolute; right: 28px; top: 24px; font-family: "Special Elite"; font-size: 48px; color: var(--red); border: 5px solid var(--red); padding: 2px 16px; opacity: 0; }
      .st-QUOTE { color: #b45309; } .st-COURT { color: #1d4ed8; } .st-REPORTED { color: #44403c; } .st-DATA { color: #0f766e; }
      .st-ESTIMATE { color: #7e22ce; } .st-OFFICIAL { color: #15803d; } .st-PROPOSED { color: #c2410c; } .st-LAW { color: #1e3a8a; }

      .endlayer { position: absolute; inset: 0; opacity: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding-bottom: 200px; }
      .evote { font-family: "Anton"; font-size: 200px; line-height: 0.95; color: #fff; opacity: 0; }
      .evote.red { color: var(--red); }
      .eorg { font-family: "Anton"; font-size: 150px; color: #fff; margin-top: 60px; opacity: 0; }
      .echeck { font-family: "Inter"; font-weight: 900; font-size: 44px; color: var(--tag); letter-spacing: 0.04em; opacity: 0; }
      .eday { font-family: "Anton"; font-size: 110px; color: var(--red); margin-top: 26px; opacity: 0; }
      .esite { font-family: "JetBrains Mono"; font-weight: 800; font-size: 34px; color: #d6d3d1; margin-top: 40px; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__DURATION__" data-width="1080" data-height="1920">
      <div id="stage" data-layout-allow-occlusion data-layout-allow-overlap>
        <div id="kicker"></div>
      </div>
      <svg id="grain" data-layout-allow-occlusion xmlns="http://www.w3.org/2000/svg">
        <filter id="n"><feTurbulence id="turb" type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="1" /></filter>
        <rect width="100%" height="100%" filter="url(#n)" />
      </svg>
      <div id="vignette" data-layout-allow-occlusion></div>
      <div id="redflash" data-layout-allow-occlusion></div>
      <div id="flash" data-layout-allow-occlusion></div>
      <audio id="mix" src="assets/audio/mix.wav" data-start="0" data-duration="__DURATION__" data-volume="1"></audio>
    </div>

    <script>
      const VIS = __VIS__;
      let seed = 4711;
      const rand = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
      const $ = (s) => document.querySelector(s);
      const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
      const stage = $("#stage");
      const addLayer = (cls) => { const L = el("div", cls); stage.appendChild(L); return L; };
      const tl = gsap.timeline({ paused: true });
      const D = parseFloat(document.getElementById("root").dataset.duration);

      function shake(at, amt = 18, dur = 0.35, steps = 7) {
        for (let i = 0; i < steps; i++) {
          const k = 1 - i / steps;
          tl.to("#stage", { x: (rand() - 0.5) * 2 * amt * k, y: (rand() - 0.5) * 2 * amt * k, duration: dur / steps, ease: "none" }, at + (i * dur) / steps);
        }
        tl.to("#stage", { x: 0, y: 0, duration: 0.05 }, at + dur);
      }
      function flash(at, which = "#flash", peak = 0.85) {
        tl.fromTo(which, { opacity: peak }, { opacity: 0, duration: 0.18, ease: "power2.out", immediateRender: false }, at);
      }
      function slamIn(node, at, from = 2.3, rot = 0, dur = 0.12) {
        tl.fromTo(node, { scale: from, opacity: 0, rotation: rot * 3 }, { scale: 1, opacity: 1, rotation: rot, duration: dur, ease: "power4.in", immediateRender: false }, at - dur);
      }
      const STAMP = { QUOTE: "QUOTED", "COURT RULING": "RULED", REPORTED: "RECEIPT", DATA: "RECEIPT", ESTIMATE: "ESTIMATE", OFFICIAL: "ON RECORD", PROPOSED: "PROPOSED", LAW: "LAW" };

      for (let i = 0; i < Math.floor(D * 15); i++) {
        tl.set("#turb", { attr: { seed: (i * 7) % 97 } }, i / 15);
        tl.set("#grain", { x: ((i * 37) % 200) - 100, y: ((i * 53) % 200) - 100 }, i / 15);
      }

      for (const ev of VIS) {
        switch (ev.kind) {
          case "slam": {
            const box = addLayer("slambox");
            ev.lines.forEach((ln, i) => {
              const s = el("div", "slamline", ln.text);
              s.style.fontSize = ln.size + "px";
              s.style.color = ln.color === "red" ? "#e3122b" : ln.color === "yellow" ? "#ffd400" : "#f5f5f4";
              box.appendChild(s);
              const at = ev.t + (ev.stagger || 0) * i;
              slamIn(s, at, 2.4);
              tl.to(s, { scale: 1.04, duration: Math.max(0.1, ev.end - at), ease: "none" }, at);
              shake(at, ln.color === "red" ? 26 : 14, 0.4);
              if (ln.color === "red") flash(at, "#redflash", 0.5);
            });
            tl.set(box, { opacity: 0 }, ev.end);
            break;
          }
          case "kicker": {
            const k = $("#kicker");
            tl.set(k, { innerHTML: ev.html }, ev.t);
            tl.fromTo(k, { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out", immediateRender: false }, ev.t);
            if (ev.end) tl.set(k, { opacity: 0 }, ev.end);
            break;
          }
          case "head": {
            const h = addLayer("head");
            h.textContent = ev.text;
            tl.fromTo(h, { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.18, ease: "power3.out", immediateRender: false }, ev.t);
            tl.set(h, { opacity: 0 }, ev.end);
            break;
          }
          case "bigstat": {
            const b = addLayer("bigstat");
            b.textContent = ev.text;
            const l = addLayer("statlbl");
            l.textContent = ev.label;
            slamIn(b, ev.t, 2.0);
            shake(ev.t, 30, 0.5);
            flash(ev.t, "#redflash", 0.5);
            tl.fromTo(l, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.2, immediateRender: false }, ev.t + 0.25);
            tl.set([b, l], { opacity: 0 }, ev.end);
            break;
          }
          case "card": {
            const c = el("div", "card");
            c.appendChild(el("div", "tag", "EXHIBIT " + String(ev.exhibit).padStart(2, "0")));
            c.appendChild(el("div", "status st-" + ev.r.status.split(" ")[0], ev.r.status));
            c.appendChild(el("div", "cap", ev.r.caption));
            c.appendChild(el("div", "src", ev.r.outlet + (ev.r.date ? " · " + ev.r.date : "")));
            const stamp = el("div", "stampmark", STAMP[ev.r.status] || "RECEIPT");
            c.appendChild(stamp);
            c.style.top = ev.y + "px";
            stage.appendChild(c);
            const r = ev.rot ?? -1.5;
            tl.fromTo(c, { opacity: 0, scale: 1.6, rotation: r * 4, y: -60 }, { opacity: 1, scale: 1, rotation: r, y: 0, duration: 0.13, ease: "power4.in", immediateRender: false }, ev.t - 0.13);
            tl.fromTo(stamp, { opacity: 0, scale: 2.2, rotation: -9 }, { opacity: 0.85, scale: 1, rotation: -9, duration: 0.1, ease: "power4.in", immediateRender: false }, ev.t + 0.12);
            shake(ev.t, 10, 0.22);
            tl.to(c, { y: 1400, rotation: r + 10, opacity: 0, duration: 0.22, ease: "power3.in" }, ev.end);
            break;
          }
          case "endcard": {
            const L = addLayer("endlayer");
            const words = ev.words.map((w, i) => { const x = el("div", "evote" + (i === 2 ? " red" : ""), w); L.appendChild(x); return x; });
            const org = el("div", "eorg", "VOTE.ORG");
            const chk = el("div", "echeck", "CHECK YOUR REGISTRATION TODAY");
            const day = el("div", "eday", "TUESDAY, NOV 3");
            [org, chk, day].forEach((x) => L.appendChild(x));
            const site = ev.site ? el("div", "esite", "receipts: " + ev.site) : null;
            if (site) L.appendChild(site);
            tl.set(L, { opacity: 1 }, ev.t);
            words.forEach((w, i) => { slamIn(w, ev.lands[i], 2.2); shake(ev.lands[i], 22 + i * 8, 0.4); flash(ev.lands[i], i === 2 ? "#redflash" : "#flash", i === 2 ? 0.6 : 0.3); });
            slamIn(org, ev.orgAt, 1.8);
            tl.fromTo(chk, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.25, immediateRender: false }, ev.orgAt + 0.3);
            slamIn(day, ev.orgAt + 0.8, 1.6);
            if (site) tl.fromTo(site, { opacity: 0 }, { opacity: 1, duration: 0.4, immediateRender: false }, ev.orgAt + 1.3);
            break;
          }
        }
      }
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
